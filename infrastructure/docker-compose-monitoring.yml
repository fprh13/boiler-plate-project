version: "3.8"

services:

  grafana:
    image: grafana/grafana:12.3
    container_name: bp-grafana
    volumes:
      - /Users/yeongmujo/Desktop/workSpace/grafana-data:/var/lib/grafana # TODO 현재 로컬에서 관리 중
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: bp-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.5.8
    container_name: bp-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.5.8
    container_name: bp-promtail
    volumes:
      - ../log:/var/log/app
      - ./promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
