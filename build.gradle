plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id('com.epages.restdocs-api-spec') version '0.19.4'
}

group = 'com.hello'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jacoco {
    toolVersion = "0.8.10"
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // DB
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
//    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // Jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Utils
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // OpenAPI Specification
    implementation 'org.springdoc:springdoc-openapi-ui:1.8.0'
    testImplementation("com.epages:restdocs-api-spec-mockmvc:0.19.4")
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
}

def extractDomainFromYaml() {
    File file = file("src/main/resources/application.yml")
    String yamlContent = file.text // YAML 전체를 문자열로 로드

    def matcher = yamlContent =~ /(?m)^dev-host:\s*(.+)$/

    if (matcher.find()) {
        return matcher.group(1).trim()
    } else {
        throw new GradleException("dev-host 값을 찾을 수 없습니다.")
    }
}

openapi3 {
    servers = [
            { url = "http://localhost:8080" },
            { url = extractDomainFromYaml() }
    ]
    title = 'Boiler Plate API'
    description = 'Boiler Plate API'
    version = new Date().format("yyyy.MM.dd HH:mm")
    format = 'yaml'
}

tasks.register('copyOasToSwagger', Copy) {
    // 기존 yaml 파일 삭제
    delete 'src/main/resources/static/swagger-ui/openapi3.yaml'

    // 복제할 yaml 파일 타겟팅
    from layout.buildDirectory.file("api-spec/openapi3.yaml")

    // 타겟 디렉토리로 파일 복제
    into 'src/main/resources/static/swagger-ui'

    // openapi3 task가 먼저 실행되도록 설정
    dependsOn tasks.named('openapi3')

    doFirst {
        // 빌드디렉터리 yaml 파일에 보안 스키마 추가
        def openapi3File = layout.buildDirectory.file("api-spec/openapi3.yaml").get().asFile

        def securitySchemesContent = "  securitySchemes:\n" +       \
                                           "    JWT:\n" +       \
                                           "      type: apiKey\n" +       \
                                           "      name: Authorization\n" +       \
                                           "      in: header\n" +      \
                                           "security:\n" +
                "  - JWT: []  "

        // openapi 3.yaml 파일에 내용을 추가
        if (openapi3File.exists()) {
            openapi3File.append(securitySchemesContent)
        } else {
            println "Warning: openapi3.yaml not found at ${openapi3File.path}"
        }
    }

    bootRun {
        // openapi3 task가 먼저 실행되도록 설정
        dependsOn 'openapi3'
    }
}


// 제외할 디렉토리 및 파일 패턴을 공통 변수로 선언
ext.jacocoExcludes = [
        "**/dto/**",       // DTO 클래스
        "**/exception/**", // 커스텀 예외
        "**/config/**",    // 설정 파일
]

tasks.named('jacocoTestReport') {
    dependsOn(tasks.named('test')) // 테스트 실행 후 리포트 생성
    reports {
        xml.required = true // SonarQube를 위한 XML 리포트 생성
        html.required = true // 사람이 읽기 쉬운 HTML 리포트 생성
        csv.required = false // CSV 리포트는 비활성화
    }
    classDirectories.setFrom(
            files(classDirectories.files.collect { dir ->
                fileTree(dir) {
                    exclude jacocoExcludes // 리포트 생성에서 제외할 디렉토리와 파일 설정
                }
            })
    )

    finalizedBy tasks.named('jacocoTestCoverageVerification') // 리포트 생성 후 검증
}
tasks.jacocoTestCoverageVerification {
    violationRules {
        rule {
            enabled = true
            element = "BUNDLE" // 전체 모듈 수준에서 통합 커버리지 검증

            limit {
                counter = "INSTRUCTION" // 라인 커버리지 기준
                value = "COVEREDRATIO"
                minimum = 0.30
            }
            excludes = jacocoExcludes
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy('copyOasToSwagger') // test 태스크 실행 후에 copyOasToSwagger 태스크 실행
    finalizedBy("jacocoTestReport") // test 태스크 실행 후에 jacocoTestReport 테스크 실행
}
